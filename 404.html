<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Halaman tidak ditemukan - Vitaminum</title>
<style>body{font-family:system-ui,sans-serif;display:grid;place-items:center;min-height:90vh;margin:0;background:#f4faf6;color:#0e201b;text-align:center;padding:1rem}a{display:inline-block;margin-top:1rem;background:#255746;color:#fff;padding:.7rem 1.4rem;border-radius:8px;text-decoration:none;font-weight:700}</style>
</head>
<body>
<main>
<h1>Halaman tidak ditemukan</h1>
<p>Link yang kamu buka sudah tidak tersedia.</p>
<a id="back" href="./">Kembali ke Vitaminum</a>
</main>
<script>
(function () {
  var m = location.pathname.match(/^(.*\/vitaminum\/)/);
  document.getElementById("back").href = m ? m[1] : "/";
})();
</script>
</body>
</html>
